spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=create-drop
spring.batch.jdbc.table-prefix=BATCH_
spring.application.name=batch-processing
management.endpoints.web.exposure.include=beans,env,health,info,metrics,mappings,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true

logging.level.com.ivanfranchin.moviesapi=DEBUG
management.metrics.tags.application=${spring.application.name}
spring.sql.init.platform=postgres


management.prometheus.metrics.export.pushgateway.enabled=true
management.prometheus.metrics.export.pushgateway.address=pushgateway:9091
management.prometheus.metrics.export.pushgateway.job=spring-batch-job
management.prometheus.metrics.export.pushgateway.shutdown-operation=post


spring.batch.job.enabled=false
spring.main.web-application-type=servlet

logging.pattern.level=%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]
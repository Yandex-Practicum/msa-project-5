spring.application.name=batch-processing

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Batch - ????????? ??????????
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_

# Actuator & Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}

# OpenTelemetry Tracing
management.tracing.sampling.probability=1.0
management.tracing.enabled=true
management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces
management.otlp.tracing.transport=grpc
management.otlp.tracing.endpoint.grpc=http://jaeger:4317

# Logging with traceId/spanId
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}/%X{spanId:-}] %-5level %logger{36} - %msg%n

logging.level.org.springframework.batch=INFO
logging.level.com.example.batchprocessing=INFO
logging.level.org.springframework.web=DEBUG
logging.file.name=/var/log/batch-processing/application.log
logging.file.path=/var/log/batch-processing
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# Включение Prometheus эндпоинта
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Метрики для Spring Batch
management.metrics.tags.application=batch-processing
management.metrics.enable.all=true
management.metrics.distribution.percentiles-histogram.batch.job.duration=true
management.metrics.distribution.slo.batch.job.duration=1s,5s,10s,30s,1m
management.metrics.distribution.percentiles-histogram.batch.step.duration=true

# Порт для JMX (если используем JMX Exporter)
spring.jmx.enabled=true
spring.jmx.default-domain=org.springframework.batch

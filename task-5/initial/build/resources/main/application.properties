spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.application.name=batch-processing
spring.datasource.username=tradeware
spring.datasource.password=tradeware
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.jdbc.initialize-schema=always
spring.jpa.hibernate.ddl-auto=none
spring.batch.jdbc.table-prefix=BATCH_
spring.batch.job.auto-startup=false
spring.main.web-application-type=servlet
server.servlet.context-path=/
server.port=8080

management.endpoints.web.exposure.include=beans,env,health,info,metrics,mappings,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=batch-processing
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.health.probes.enabled=true
management.endpoints.web.base-path=/actuator
management.server.port=8080

logging.level.com.ivanfranchin.moviesapi=DEBUG
logging.level.com.example.batchprocessing=DEBUG
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.web=INFO
spring.application.name=batch-processing
spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_
spring.jpa.hibernate.ddl-auto=none

spring.batch.job.enabled=false

management.endpoints.web.exposure.include=beans,env,health,info,metrics,mappings,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

logging.level.com.example.batchprocessing=DEBUG
logging.file.path=/app/logs
logging.file.name=app.log
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
global:
  resolve_timeout: 5m
  # Настройки для Telegram
  telegram_api_url: "https://api.telegram.org"

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h
  receiver: 'telegram-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'telegram-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'telegram-warnings'
      continue: true

receivers:
  - name: 'telegram-notifications'
    telegram_configs:
      - bot_token: 'YOUR_BOT_TOKEN'
        chat_id: YOUR_CHAT_ID
        api_url: "https://api.telegram.org"
        parse_mode: 'HTML'
        message: |-
          <b>{{ .Status | toUpper }}</b>
          <b>Alert:</b> {{ .GroupLabels.alertname }}
          <b>Service:</b> {{ .GroupLabels.service }}
          <b>Severity:</b> {{ .GroupLabels.severity }}
          {{ range .Alerts }}
            {{ if .Annotations.summary }}
          <b>Summary:</b> {{ .Annotations.summary }}
            {{ end }}
            {{ if .Annotations.description }}
          <b>Description:</b> {{ .Annotations.description }}
            {{ end }}
          <b>Value:</b> {{ .Annotations.value }}
          <b>Started:</b> {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  - name: 'telegram-critical'
    telegram_configs:
      - bot_token: 'YOUR_BOT_TOKEN'
        chat_id: YOUR_CHAT_ID
        api_url: "https://api.telegram.org"
        parse_mode: 'HTML'
        message: |-
          🚨 <b>КРИТИЧЕСКИЙ АЛЕРТ</b> 🚨
          {{ range .Alerts }}
          <b>Alert:</b> {{ .Labels.alertname }}
          <b>Summary:</b> {{ .Annotations.summary }}
          <b>Description:</b> {{ .Annotations.description }}
          {{ end }}

  - name: 'telegram-warnings'
    telegram_configs:
      - bot_token: 'YOUR_BOT_TOKEN'
        chat_id: YOUR_CHAT_ID
        api_url: "https://api.telegram.org"
        parse_mode: 'HTML'
        message: |-
          ⚠️ <b>ПРЕДУПРЕЖДЕНИЕ</b> ⚠️
          {{ range .Alerts }}
          <b>Alert:</b> {{ .Labels.alertname }}
          <b>Summary:</b> {{ .Annotations.summary }}
          {{ end }}


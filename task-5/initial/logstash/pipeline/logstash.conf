input {
  beats {
    port => 5044
    host => "0.0.0.0"
    ssl => false
  }
}

filter {
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "parsed"
    }
    
    if [parsed] {
      mutate {
        add_field => {
          "level" => "%{[parsed][level]}"
          "logger" => "%{[parsed][logger]}"
          "thread" => "%{[parsed][thread]}"
          "message" => "%{[parsed][message]}"
        }
        remove_field => [ "parsed" ]
      }
    }
  }

  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp}" }
  }

  date {
    match => [ "log_timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => [ "log_timestamp" ]
  }

  mutate {
    add_field => { 
      "processed_by" => "logstash" 
      "log_type" => "application"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }

  stdout { 
    codec => rubydebug 
  }
}
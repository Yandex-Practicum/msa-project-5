name: tradeware-task5
services:
  postgresdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: productsdb
    ports: ['5433:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema-all.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-loyality.sql:/docker-entrypoint-initdb.d/02-loyality.sql:ro
      - ./src/main/resources/loyality_data.csv:/seed/loyality_data.csv:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d productsdb']
      interval: 3s
      timeout: 5s
      retries: 30
  app:
    build: .
    image: tradeware-task5-app:local
    depends_on:
      postgresdb: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgresdb:5432/productsdb
      DB_USER: postgres
      DB_PASSWORD: '123456'
      APP_INPUT: ${APP_INPUT:-classpath:product-data.csv}
    ports: ['8080:8080']
    volumes: ['app-logs:/logs']
  prometheus-agent:
    image: prom/prometheus:v2.54.1
    user: '0:0'
    command: ['--enable-feature=agent', '--config.file=/etc/prometheus/agent.yml', '--storage.agent.path=/prometheus-agent']
    volumes:
      - ./prometheus/agent.yml:/etc/prometheus/agent.yml:ro
      - agent-data:/prometheus-agent
    depends_on: [prometheus]
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--web.enable-remote-write-receiver']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['9090:9090']
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes: ['./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    ports: ['9093:9093']
    depends_on: [alert-receiver]
  alert-receiver:
    image: python:3.12-alpine
    command: ['python', '-u', '/app/receiver.py']
    volumes: ['./prometheus/receiver.py:/app/receiver.py:ro']
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['3000:3000']
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports: ['9200:9200']
    volumes: ['elastic-data:/usr/share/elasticsearch/data']
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9200/_cluster/health > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.28
    environment:
      LS_JAVA_OPTS: '-Xms256m -Xmx256m'
    volumes: ['./logstash/pipeline:/usr/share/logstash/pipeline:ro']
    depends_on:
      elasticsearch: {condition: service_healthy}
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.28
    user: root
    command: ['-e', '--strict.perms=false']
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app-logs:/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on: [logstash]
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ['5601:5601']
    depends_on:
      elasticsearch: {condition: service_healthy}
volumes:
  pgdata: {name: tradeware-task5-postgres}
  app-logs: {name: tradeware-task5-app-logs}
  agent-data: {name: tradeware-task5-agent}
  prometheus-data: {name: tradeware-task5-prometheus}
  grafana-data: {name: tradeware-task5-grafana}
  elastic-data: {name: tradeware-task5-elasticsearch}
  filebeat-data: {name: tradeware-task5-filebeat}

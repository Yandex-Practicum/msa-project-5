filebeat.autodiscover:
  providers:
    - type: docker
      host: unix:///var/run/docker.sock
      templates:
        - condition:
            equals:
              docker.container.name: batch-processing
          config:
            - type: container
              containers:
                ids:
                  - "${data.docker.container.id}"
              paths:
                - "/var/lib/docker/containers/${data.docker.container.id}/*.log"
              stream: stdout
              processors:
                - decode_json_fields:
                    fields: ["message"]
                    target: ""
                    overwrite_keys: true
                    add_error_key: true
                - add_docker_metadata:
                    host: unix:///var/run/docker.sock

output.logstash:
  hosts:
    - logstash:5044

setup.template.enabled: false
logging.level: info
logging.to_files: false

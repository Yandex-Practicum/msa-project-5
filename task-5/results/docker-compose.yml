services:
  postgresdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-demo
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productsdb"]
      interval: 2s
      retries: 30
  app:
    build: ./app
    environment:
      DATABASE_URL: jdbc:postgresql://postgresdb:5432/productsdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: local-demo
    ports:
      - "8081:8080"
    volumes:
      - batch-logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.4.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
  prometheus-agent:
    image: prom/prometheus:v3.4.0
    command: ["--config.file=/etc/prometheus/agent.yml", "--storage.agent.path=/prometheus", "--agent"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    depends_on:
      - prometheus
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "9093:9093"
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8026:8025"
  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-demo
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9201:9200"
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.28
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.28
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - batch-logs:/logs:ro
    depends_on:
      - logstash
volumes:
  batch-logs:

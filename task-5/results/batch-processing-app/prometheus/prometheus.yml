global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: 'batch-processing'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 'app' — имя сервиса в той же docker-compose сети, разрешается штатным Docker DNS;
      # надёжнее, чем host.docker.internal (тот работает только на Docker Desktop)
      - targets: ['app:8080']
        labels:
          application: batch-processing

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: airflow
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-init:
    image: confluentinc/cp-kafka:7.0.1
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..." && \
        cub kafka-ready -b kafka:29092 1 20 && \
        kafka-topics --create \
          --topic order_events \
          --bootstrap-server kafka:29092 \
          --partitions 1 \
          --replication-factor 1 || \
        echo "Topic order_events already exists"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  airflow-init:
    image: apache/airflow:2.9.3-python3.11
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__SMTP__SMTP_HOST: mailhog
      AIRFLOW__SMTP__SMTP_PORT: 1025
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.ru
      AIRFLOW__SMTP__SMTP_STARTTLS: "False"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "db075fdc923adfa0125a547ccaab61b4d28da331517e3f2cdbe0cace7a5767a9"
      AIRFLOW__WEBSERVER__BASE_URL: "http://webserver:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: bash
    command:
      - -c
      - |
        pip install --upgrade pip && \
        pip install --no-cache-dir -r /opt/airflow/requirements.txt && \
        export PATH=$PATH:/home/airflow/.local/bin && \
        airflow db migrate && \
        airflow users create \
          --username admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com --password admin && \
        airflow connections add 'data_postgres' \
          --conn-uri 'postgresql+psycopg2://airflow:airflow@postgres:5432/airflow' && \
        airflow connections add 'kafka_default' \
          --conn-type 'kafka' \
          --conn-extra '{"bootstrap.servers": "kafka:29092", "group.id": "airflow-group", "auto.offset.reset": "earliest"}'

    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    dns:
      - 8.8.8.8
      - 8.8.4.4

  webserver:
    image: apache/airflow:2.9.3-python3.11
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__SMTP__SMTP_HOST: mailhog
      AIRFLOW__SMTP__SMTP_PORT: 1025
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.ru
      AIRFLOW__SMTP__SMTP_STARTTLS: "False"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "db075fdc923adfa0125a547ccaab61b4d28da331517e3f2cdbe0cace7a5767a9"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: bash
    command:
      - -c
      - |
        pip install --upgrade pip && \
        pip install --no-cache-dir -r /opt/airflow/requirements.txt && \
        export PATH=$PATH:/home/airflow/.local/bin && \
        airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    dns:
      - 8.8.8.8
      - 8.8.4.4

  scheduler:
    image: apache/airflow:2.9.3-python3.11
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__SMTP__SMTP_HOST: mailhog
      AIRFLOW__SMTP__SMTP_PORT: 1025
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.ru
      AIRFLOW__SMTP__SMTP_STARTTLS: "False"
      AIRFLOW__SMTP__SMTP_SSL: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "db075fdc923adfa0125a547ccaab61b4d28da331517e3f2cdbe0cace7a5767a9"
      AIRFLOW__WEBSERVER__BASE_URL: "http://localhost:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements.txt:/opt/airflow/requirements.txt
      - ./data:/opt/airflow/data
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: bash
    command:
      - -c
      - |
        pip install --upgrade pip && \
        pip install --no-cache-dir -r /opt/airflow/requirements.txt && \
        export PATH=$PATH:/home/airflow/.local/bin && \
        airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  pgdata:

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__TEST_CONNECTION: "Enabled"
    # SMTP для email-уведомлений (в POC используется логирование)
    AIRFLOW__SMTP__SMTP_HOST: "mailhog"
    AIRFLOW__SMTP__SMTP_PORT: 1025
    AIRFLOW__SMTP__SMTP_MAIL_FROM: "airflow@tradeware.local"
    AIRFLOW__SMTP__SMTP_STARTTLS: "false"
    AIRFLOW__SMTP__SMTP_SSL: "false"
    # Подключение к БД
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "Europe/Moscow"
    AIRFLOW_CONN_TRADEWARE_DB: postgresql+psycopg2://tradeware:tradeware@tradeware-db:5432/tradeware
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    tradeware-db:
      condition: service_healthy

services:
  # Airflow metadata DB
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # БД номенклатуры
  tradeware-db:
    image: postgres:15
    environment:
      POSTGRES_USER: tradeware
      POSTGRES_PASSWORD: tradeware
      POSTGRES_DB: tradeware
    ports:
      - "5433:5432"
    volumes:
      - tradeware-db-volume:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tradeware"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # MailHog для перехвата email-уведомлений
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI
    restart: always

  # Airflow Webserver
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "pgrep", "-f", "airflow scheduler"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Airflow Init
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@tradeware.local \
          --password airflow
        # Создаем подключение к БД
        airflow connections delete tradeware_db 2>/dev/null || true
        airflow connections add tradeware_db \
          --conn-type postgres \
          --conn-host tradeware-db \
          --conn-port 5432 \
          --conn-login tradeware \
          --conn-password tradeware \
          --conn-schema tradeware
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      tradeware-db:
        condition: service_healthy

volumes:
  postgres-db-volume:
  tradeware-db-volume:
  airflow-logs:

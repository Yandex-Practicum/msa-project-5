server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /jobs/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend app:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}

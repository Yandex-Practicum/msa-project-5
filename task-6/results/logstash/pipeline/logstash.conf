input {
  beats {
    port => 5044
  }
}

filter {
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  if ![service] {
    mutate {
      add_field => { "service" => "batch-processing" }
    }
  }

  mutate {
    add_field => { "environment" => "local" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "batch-processing-%{+YYYY.MM.dd}"
    manage_template => false
  }
}

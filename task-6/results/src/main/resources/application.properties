spring.application.name=batch-processing
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productsdb}
spring.datasource.username=${DB_USER:products}
spring.datasource.password=${DB_PASSWORD:products-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.batch.jdbc.initialize-schema=always
spring.batch.job.name=importProductJob
spring.batch.job.enabled=false

batch.input-resource=${BATCH_INPUT_RESOURCE:classpath:product-data.csv}
batch.chunk-size=${BATCH_CHUNK_SIZE:500}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true
management.metrics.enable.spring.batch=false
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=w3c

logging.config=classpath:logback-spring.xml

spring.application.name=batch-processing

spring.datasource.url=jdbc:postgresql://postgresdb:5432/productsdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.table-prefix=BATCH_

# Джоба запускается не при старте приложения, а вызовом REST API (Task 6)
spring.batch.job.enabled=false

# Actuator: health для healthcheck'ов, prometheus — точка сбора метрик
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true
management.metrics.tags.application=batch-processing

# Трейсинг: все запросы сэмплируем, спаны отправляем в Zipkin
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans

logging.level.com.example.batchprocessing=DEBUG

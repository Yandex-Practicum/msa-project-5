name: task6-tracing

services:
  postgresdb:
    image: postgres:15-alpine
    container_name: etl-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_USER=$POSTGRESDB_USER
      - POSTGRES_PASSWORD=$POSTGRESDB_ROOT_PASSWORD
      - POSTGRES_DB=$POSTGRESDB_DATABASE
    ports:
      - $POSTGRESDB_LOCAL_PORT:$POSTGRESDB_DOCKER_PORT
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRESDB_USER -d $$POSTGRESDB_DATABASE"]
      interval: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: batch-processing
    container_name: batch-processing
    restart: unless-stopped
    depends_on:
      postgresdb:
        condition: service_healthy
      zipkin:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      # JSON-логи приложения, которые забирает Filebeat
      - etl-logs:/var/log/etl
    healthcheck:
      test: "curl -f http://localhost:8080/actuator/health || exit 1"
      interval: 10s
      retries: 12
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: "curl -fs http://localhost:9200/_cluster/health || exit 1"
      interval: 10s
      retries: 12
      start_period: 40s

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.28
    container_name: logstash
    restart: unless-stopped
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline/:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5044' || exit 1"]
      interval: 10s
      retries: 12
      start_period: 90s

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    container_name: kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    build: filebeat
    container_name: filebeat
    restart: unless-stopped
    volumes:
      # Читаем JSON-логи приложения с общего volume
      # (bind-mount /var/lib/docker/containers не работает под Docker Desktop/WSL2).
      - etl-logs:/usr/share/etl-logs:ro
    depends_on:
      logstash:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"

  client:
    build: client
    image: etl-job-client
    container_name: etl-job-client
    restart: "no"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  etl-logs:

name: sprint5-task6
services:
  postgresdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-demo
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productsdb"]
      interval: 2s
      retries: 30
  app:
    build: ./app
    environment:
      DATABASE_URL: jdbc:postgresql://postgresdb:5432/productsdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: local-demo
    ports:
      - "8082:8080"
    volumes:
      - batch-logs:/logs
    depends_on:
      postgresdb:
        condition: service_healthy
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9202:9200"
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.28
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elasticsearch
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.28
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5602:5601"
    depends_on:
      - elasticsearch
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.28
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - batch-logs:/logs:ro
    depends_on:
      - logstash
volumes:
  batch-logs:

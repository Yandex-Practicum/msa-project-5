services:
  postgresdb:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: productsdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema-all.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init-loyality.sql:/docker-entrypoint-initdb.d/02-loyality.sql:ro
      - ./src/main/resources/loyality_data.csv:/seed/loyality_data.csv:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d productsdb']
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    build: .
    depends_on:
      postgresdb:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgresdb:5432/productsdb
      DB_USER: postgres
      DB_PASSWORD: '123456'
volumes:
  pgdata:
    name: tradeware-products-data

services:
  postgresdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-demo
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productsdb"]
      interval: 2s
      retries: 30
  app:
    build: ./app
    environment:
      DATABASE_URL: jdbc:postgresql://postgresdb:5432/productsdb
      DATABASE_USER: postgres
      DATABASE_PASSWORD: local-demo
    depends_on:
      postgresdb:
        condition: service_healthy

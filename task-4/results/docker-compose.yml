name: task4-etl

services:
  postgresdb:
    image: postgres:15-alpine
    container_name: etl-postgres
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_USER=$POSTGRESDB_USER
      - POSTGRES_PASSWORD=$POSTGRESDB_ROOT_PASSWORD
      - POSTGRES_DB=$POSTGRESDB_DATABASE
    ports:
      - $POSTGRESDB_LOCAL_PORT:$POSTGRESDB_DOCKER_PORT
    volumes:
      # Схема products/loyality_data + справочные данные создаются при первом старте БД
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRESDB_USER -d $$POSTGRESDB_DATABASE"]
      interval: 5s
      retries: 10
      start_period: 5s

  app:
    depends_on:
      postgresdb:
        condition: service_healthy
    image: batch-processing
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: batch-processing
    restart: "no"

volumes:
  pgdata:

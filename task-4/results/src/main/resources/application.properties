spring.application.name=batch-processing
spring.main.web-application-type=none

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/productsdb}
spring.datasource.username=${DB_USER:products}
spring.datasource.password=${DB_PASSWORD:products-password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.batch.jdbc.initialize-schema=always
spring.batch.job.name=importProductJob

batch.input-resource=${BATCH_INPUT_RESOURCE:classpath:product-data.csv}
batch.chunk-size=${BATCH_CHUNK_SIZE:500}

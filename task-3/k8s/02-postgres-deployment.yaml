apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-analytics
  namespace: task3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-analytics
  template:
    metadata:
      labels:
        app: pg-analytics
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: analytics
            - name: POSTGRES_USER
              value: analytics
            - name: POSTGRES_PASSWORD
              value: analytics
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["bash", "-lc", "pg_isready -U analytics -d analytics"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          emptyDir: {}
        - name: initdb
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: pg-analytics
  namespace: task3
spec:
  selector:
    app: pg-analytics
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

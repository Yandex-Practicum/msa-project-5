apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipments-export
spec:
  schedule: "0 20 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: export
              image: export-shipments:local
              imagePullPolicy: IfNotPresent
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: password
                - name: PGDATABASE
                  value: demo
                - name: TABLE_NAME
                  value: shipments
                - name: OUT_DIR
                  value: /out
              volumeMounts:
                - name: out
                  mountPath: /out
          volumes:
            - name: out
              emptyDir: {}

apiVersion: batch/v1
kind: Job
metadata:
  name: test-export
  namespace: data-exports
spec:
  template:
    spec:
      containers:
        - name: exporter
          image: data-exporter:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: export-config
            - secretRef:
                name: export-secret
      restartPolicy: OnFailure
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-export-cronjob
  namespace: default
spec:
  schedule: "0 20 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
          - name: export-volume
            persistentVolumeClaim:
              claimName: export-pvc
          containers:
          - name: export-container
            image: export-job:latest
            imagePullPolicy: IfNotPresent
            volumeMounts:
            - mountPath: /export
              name: export-volume
            env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_NAME
              value: "testdb"
            - name: DB_USER
              value: "dbuser"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          restartPolicy: OnFailure
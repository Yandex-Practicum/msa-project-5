apiVersion: v1
kind: Secret
metadata:
  name: shipment-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: local-demo
  DATABASE_URL: postgresql://postgres:local-demo@shipment-db:5432/shipments
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipment-schema
data:
  init.sql: |
    CREATE TABLE shipments (id BIGINT PRIMARY KEY, client_id BIGINT NOT NULL, status TEXT NOT NULL);
    INSERT INTO shipments VALUES (1, 101, 'delivered'), (2, 102, 'in_transit'), (3, 103, 'delivered');
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipment-db
  template:
    metadata:
      labels:
        app: shipment-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: shipments
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipment-db
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: schema
          configMap:
            name: shipment-schema
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-db
spec:
  selector:
    app: shipment-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shipment-exports
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipment-export
spec:
  schedule: "0 20 * * *"
  timeZone: Europe/Moscow
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: export
              image: shipment-export:local
              imagePullPolicy: Never
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: shipment-db
                      key: DATABASE_URL
              volumeMounts:
                - name: exports
                  mountPath: /exports
          volumes:
            - name: exports
              persistentVolumeClaim:
                claimName: shipment-exports
---
apiVersion: v1
kind: Pod
metadata:
  name: export-reader
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: exports
          mountPath: /exports
  volumes:
    - name: exports
      persistentVolumeClaim:
        claimName: shipment-exports

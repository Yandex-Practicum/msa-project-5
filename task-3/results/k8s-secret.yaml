apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: logistics
type: Opaque
stringData:
  DB_HOST: "analytics-db.logistics.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "logistics_analytics"
  DB_USER: "exporter_user"
  DB_PASSWORD: "exporter_user"  # Заменить на реальный пароль!
  # Список таблиц для выгрузки (через запятую)
  TABLES: "shipments,shipment_events,drivers,vehicles,clients"
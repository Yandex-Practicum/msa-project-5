apiVersion: batch/v1
kind: CronJob
metadata:
  name: msa-sprint5-task3
spec:
  # Daily at 8 pm
  schedule: "0 20 * * *"
  concurrencyPolicy: Forbid
  # assuming k8s 1.27+
  timeZone: "Europe/Moscow"
  startingDeadlineSeconds: 120
  # 2 weeks for tracking success/failures dynamic
  successfulJobsHistoryLimit: 14
  failedJobsHistoryLimit: 14
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: msa-sprint5-task3
            image: msa_sprint5_task3:latest
            imagePullPolicy: "Never"
            args: ["python", "etl.py"]
            env:
            - name: DB_HOST
              value: "demo-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "demodb"
            - name: DB_USER
              value: "demo_user"
            - name: DB_PASSWORD
              value: "demo_password"
          restartPolicy: OnFailure
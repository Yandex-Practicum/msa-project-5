apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-db-init-script
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        first_name VARCHAR(50),
        last_name VARCHAR(50),
        email VARCHAR(100),
        age INT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO users (first_name, last_name, email, age)
    SELECT
        'User_' || substr(md5(random()::text), 1, 5),
        'Family_' || substr(md5(random()::text), 1, 5),
        'user_' || i || '@yandex-practicum.ru',
        floor(random() * 80 + 18)::int
    FROM generate_series(1, 1000) as i;

---
apiVersion: v1
kind: Service
metadata:
  name: demo-db
spec:
  selector:
    app: demo-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-db
spec:
  selector:
    matchLabels:
      app: demo-db
  template:
    metadata:
      labels:
        app: demo-db
    spec:
      containers:
      - name: demo-db
        image: postgres:17
        env:
        - name: POSTGRES_USER
          value: "demo_user"
        - name: POSTGRES_PASSWORD
          value: "demo_password"
        - name: POSTGRES_DB
          value: "demodb"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
      volumes:
      - name: init-script
        configMap:
          name: demo-db-init-script

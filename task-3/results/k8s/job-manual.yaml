apiVersion: batch/v1
kind: Job
metadata:
  name: daily-data-export-manual
  namespace: transport-analytics
  labels:
    app: data-export
    type: manual
spec:
  template:
    metadata:
      labels:
        app: data-export
        job-type: manual
    spec:
      serviceAccountName: export-job-sa
      restartPolicy: OnFailure
      containers:
        - name: data-exporter
          image: exportapp:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: export-job-config
            - secretRef:
                name: export-job-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: export-data
              mountPath: /tmp/export
            - name: export-logs
              mountPath: /var/log/export_job
      volumes:
        - name: export-data
          emptyDir:
            sizeLimit: 2Gi
        - name: export-logs
          emptyDir:
            sizeLimit: 100Mi
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
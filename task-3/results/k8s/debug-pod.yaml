apiVersion: v1
kind: Pod
metadata:
  name: export-output-viewer
spec:
  containers:
    - name: viewer
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: export-output
          mountPath: /export
          readOnly: true
  volumes:
    - name: export-output
      persistentVolumeClaim:
        claimName: export-output

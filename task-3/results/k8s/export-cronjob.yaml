apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: export-output
  namespace: logistics
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: export-db-credentials
  namespace: logistics
type: Opaque
stringData:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "logistics"
  DB_USER: "logistics"
  DB_PASSWORD: "logistics"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: export-shipments
  namespace: logistics
spec:
  schedule: "0 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        spec:
          containers:
            - name: export
              image: export-table:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: TABLE_NAME
                  value: "shipments"
                - name: OUTPUT_DIR
                  value: "/output"
              envFrom:
                - secretRef:
                    name: export-db-credentials
              volumeMounts:
                - name: output
                  mountPath: /output
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: export-output
          restartPolicy: OnFailure

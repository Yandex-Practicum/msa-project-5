apiVersion: batch/v1
kind: CronJob
metadata:
  name: shipments-export
spec:
  schedule: "0 20 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: exporter
              image: shipments-exporter:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: export-config
                - secretRef:
                    name: postgres-secret

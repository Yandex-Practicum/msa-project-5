apiVersion: v1
kind: ServiceAccount
metadata:
  name: export-job-sa
  namespace: transport-analytics
  labels:
    app: data-export
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: export-job-role
  namespace: transport-analytics
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: export-job-rolebinding
  namespace: transport-analytics
subjects:
  - kind: ServiceAccount
    name: export-job-sa
    namespace: transport-analytics
roleRef:
  kind: Role
  name: export-job-role
  apiGroup: rbac.authorization.k8s.io
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-export
  namespace: data-export
  labels:
    app: logistics-export
spec:
  schedule: "0 20 * * *"
  timeZone: "Europe/Moscow"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  startingDeadlineSeconds: 600

  jobTemplate:
    metadata:
      labels:
        app: logistics-export
        job-type: daily-export
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app: logistics-export
        spec:
          restartPolicy: Never

          containers:
            - name: export
              image: logistics-export:latest
              imagePullPolicy: IfNotPresent

              envFrom:
                - secretRef:
                    name: db-credentials
                - configMapRef:
                    name: export-config

              env:
                - name: EXPORT_DATE
                  value: ""   

              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"

              volumeMounts:
                - name: output
                  mountPath: /app/output

          volumes:
            - name: output
              emptyDir: {}
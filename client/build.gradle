plugins {
    id 'application'
    id 'java'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Логирование
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // Jackson для парсинга JSON-ответов
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
}

application {
    mainClass = 'com.example.batchprocessing.client.BatchJobClient'
}

// Запуск клиента: ./gradlew run
run {
    args = ['product-data.csv']
}

// Сборка fat JAR со всеми зависимостями
task fatJar(type: Jar) {
    manifest {
        attributes 'Main-Class': 'com.example.batchprocessing.client.BatchJobClient'
    }
    archiveFileName = 'batch-client.jar'
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}